    const tableBody = document.getElementById('tableBody');
    const recordCount = document.getElementById('recordCount');
    
    const filters = {
        edition: document.getElementById('editionFilter'),
        group: document.getElementById('groupFilter'),
        event: document.getElementById('eventFilter'),
        search: document.getElementById('searchInput')
    };

    function getRankClass(rank) {
        if(rank.includes('一') || rank.includes('冠')) return 'rank-1';
        if(rank.includes('二') || rank.includes('亞')) return 'rank-2';
        if(rank.includes('三') || rank.includes('季')) return 'rank-3';
        return '';
    }

    function renderTable(data) {
        tableBody.innerHTML = '';
        recordCount.textContent = `顯示共 ${data.length} 筆紀錄`;
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#888;">找不到符合條件的成績。請嘗試放寬篩選條件。</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge">${item.edition.split(" ")[0]}</span></td>
                <td>${item.group}</td>
                <td>${item.event}</td>
                <td class="${getRankClass(item.rank)}">${item.rank}</td>
                <td>${item.name || '-'}</td>
                <td>${item.school || '-'}</td>
                <td><strong>${item.score}</strong></td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function applyFilters() {
        const editionVal = filters.edition.value;
        const groupVal = filters.group.value;
        const eventVal = filters.event.value;
        const searchVal = filters.search.value.toLowerCase().trim();

        const filtered = athleticsData.filter(item => {
            if (editionVal && !item.edition.includes(editionVal)) return false;
            if (groupVal && !item.group.includes(groupVal)) return false;
            if (eventVal && !item.event.includes(eventVal)) return false;
            if (searchVal) {
                const rowString = Object.values(item).join(' ').toLowerCase();
                if (!rowString.includes(searchVal)) return false;
            }
            return true;
        });
        
        renderTable(filtered);
    }

    Object.values(filters).forEach(element => {
        element.addEventListener('input', applyFilters);
        element.addEventListener('change', applyFilters);
    });

    renderTable(athleticsData);
