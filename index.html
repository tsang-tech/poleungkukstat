    const tableBody = document.getElementById('tableBody');

    const recordCount = document.getElementById('recordCount');

    function getRankClass(rank) {
        if(rank.includes('一') || rank.includes('冠')) return 'rank-1';
        if(rank.includes('二') || rank.includes('亞')) return 'rank-2';
        if(rank.includes('三') || rank.includes('季')) return 'rank-3';
        return '';
    }

    function renderTable(data) {
        tableBody.innerHTML = '';
        recordCount.textContent = `顯示共 ${data.length} 筆紀錄`;
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#888;">找不到符合的成績。</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge">${item.edition}</span></td>
                <td>${item.group}</td>
                <td>${item.event}</td>
                <td class="${getRankClass(item.rank)}">${item.rank}</td>
                <td>${item.name}</td>
                <td>${item.school}</td>
                <td><strong>${item.score}</strong></td>
            `;
            tableBody.appendChild(tr);
        });
    }

    renderTable(athleticsData);

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = athleticsData.filter(item => {
            const rowString = Object.values(item).join(' ').toLowerCase();
            return rowString.includes(keyword);
        });
        renderTable(filtered);
    });
